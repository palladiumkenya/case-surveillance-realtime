version: '3.5'

services:
  admin-server:
    build: ../admin/
    ports:
      - "${ADMIN_SERVER_PORT:-8066}:8088"
    environment:
      TZ: Africa/Nairobi
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

  api:
    build: ../api/
    image: kenyahmis/cs-api:latest
    ports:
      - "${API_PORT:-8099}:8088"
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      KEYCLOAK_JWT_CERT_URL: ${KEYCLOAK_JWT_CERT_URL}
#      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      SPRING_DOC_SERVER_URL: ${SPRING_DOC_SERVER_URL}
      CS_REDIS_HOST: ${CS_REDIS_HOST}
      CS_REDIS_PORT: ${CS_REDIS_PORT}
      RATE_LIMITING_ENABLED: ${RATE_LIMITING_ENABLED:-true}
      RATE_LIMITING_TTL: ${RATE_LIMITING_TTL:-24}
      SPRING_BOOT_ADMIN_CLIENT_URL: ${ADMIN_SERVER_URL}
      TZ: Africa/Nairobi
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD}
  worker:
    build: ../worker/
    image: kenyahmis/cs-worker:latest
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      GLOBAL_START_THRESHOLD: ${GLOBAL_START_THRESHOLD:-2026-06-01}
      PREP_START_THRESHOLD: ${PREP_START_THRESHOLD:-2026-01-01}
      VL_START_THRESHOLD: ${VL_START_THRESHOLD:-2026-06-01}
      HEI_START_THRESHOLD: ${HEI_START_THRESHOLD:-2026-06-01}
      SPRING_BOOT_ADMIN_CLIENT_URL: ${ADMIN_SERVER_URL}
      TZ: Africa/Nairobi
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ACTUATOR_USERNAME: ${ACTUATOR_USERNAME}
      ACTUATOR_PASSWORD: ${ACTUATOR_PASSWORD}
  cs_redis:
    image: redis:7
    restart: unless-stopped
    environment:
      TZ: Africa/Nairobi
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single-node defaults (Bitnami set these implicitly; Kafka's own defaults assume 3 brokers)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      TZ: Africa/Nairobi
    volumes:
      - kafka_apache_data:/var/lib/kafka/data
volumes:
  kafka_apache_data:

